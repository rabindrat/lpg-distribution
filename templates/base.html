{% load static %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}LPG Distribution{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://unpkg.com/htmx.org@2.0.4"></script>
</head>
<body class="bg-light">
  <nav class="navbar navbar-expand-lg bg-white border-bottom mb-4">
    <div class="container">
      <a class="navbar-brand fw-semibold" href="{% url 'home' %}">LPG Distribution</a>
      <div class="d-flex align-items-center gap-3">
        {% if request.user.is_authenticated %}
          <a href="{% url 'dashboard' %}" class="link-secondary">Dashboard</a>
          <a href="{% url 'logout' %}" class="btn btn-outline-secondary btn-sm">Log out</a>
        {% else %}
          <a href="{% url 'login' %}" class="link-secondary">Log in</a>
          <a href="{% url 'dealer-register' %}" class="link-secondary">Dealer registration</a>
          <a href="{% url 'register' %}" class="btn btn-primary btn-sm">Register</a>
        {% endif %}
      </div>
    </div>
  </nav>
  <main class="container pb-5">
    {% for message in messages %}
      <div class="alert alert-{{ message.tags|default:'info' }}" role="alert">{{ message }}</div>
    {% endfor %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
