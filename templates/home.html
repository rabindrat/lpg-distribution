{% extends "base.html" %}
{% block title %}Apply for LPG{% endblock %}
{% block content %}
<div class="row justify-content-center py-5">
  <div class="col-lg-8 text-center">
    <span class="badge text-bg-primary mb-3">Applicant portal</span>
    <h1 class="display-5 fw-semibold">Apply for LPG delivery from one place.</h1>
    <p class="lead text-secondary mt-3">Register your household, submit an application, and track its status online.</p>
    <div class="d-flex justify-content-center gap-2 mt-4">
      <a href="{% url 'register' %}" class="btn btn-primary btn-lg">Create applicant account</a>
      <a href="{% url 'login' %}" class="btn btn-outline-secondary btn-lg">Log in</a>
    </div>
  </div>
</div>
{% endblock %}
