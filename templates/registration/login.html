{% extends "base.html" %}
{% load crispy_forms_tags %}
{% block title %}Log in{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-5">
    <div class="card border-0 shadow-sm">
      <div class="card-body p-4 p-md-5">
        <h1 class="h3">Log in</h1>
        <p class="text-secondary">Use your registered mobile number and password.</p>
        <form method="post">
          {% csrf_token %}
          {{ form|crispy }}
          {% if next %}<input type="hidden" name="next" value="{{ next }}">{% endif %}
          <button class="btn btn-primary w-100 mt-2" type="submit">Log in</button>
        </form>
        <p class="small text-secondary mt-4 mb-0">Need an account? <a href="{% url 'register' %}">Register here</a>.</p>
      </div>
    </div>
  </div>
</div>
{% endblock %}
