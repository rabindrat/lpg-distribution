{% extends "base.html" %}
{% load crispy_forms_tags %}
{% block title %}Create applicant account{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-6">
    <div class="card border-0 shadow-sm">
      <div class="card-body p-4 p-md-5">
        <h1 class="h3">Create applicant account</h1>
        <p class="text-secondary">Use your mobile number as your username.</p>
        <form method="post" novalidate>
          {% csrf_token %}
          {{ form|crispy }}
          <button class="btn btn-primary w-100 mt-2" type="submit">Continue</button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
