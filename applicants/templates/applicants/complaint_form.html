{% extends "base.html" %}
{% load crispy_forms_tags %}
{% block title %}Submit a complaint{% endblock %}
{% block content %}
<div class="auth-layout auth-layout--complaint container">
  <div class="auth-card auth-card--complaint">
    <div class="mb-4">
      <span class="text-primary fw-semibold">Applicant support</span>
      <h1 class="h3 mt-2">Submit a complaint</h1>
      <p class="text-secondary">Share the details of the issue and we will review it.</p>
    </div>
    <div class="card border-0 shadow-sm">
      <div class="card-body p-4 p-md-5">
        <form method="post" novalidate>
          {% csrf_token %}
          {{ form|crispy }}
          <button class="btn btn-primary" type="submit">Submit complaint</button>
          <a href="{% url 'dashboard' %}" class="btn btn-link">Cancel</a>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
